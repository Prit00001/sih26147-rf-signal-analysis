[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigscope"
version = "0.1.0"
description = "Offline RF signal parameter extraction and demodulation tool (SIH26147)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pydantic>=2.7",
    "matplotlib>=3.8",
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pytest-qt>=4.4",
]
# Train-time only: PyTorch is NOT required at runtime (ONNX Runtime is the
# inference dependency, in [project.dependencies]). Keeps the shipped tool
# lean and avoids pulling PyTorch into an analyst's air-gapped install.
train = [
    "torch>=2.2",
    "onnxscript",  # torch.onnx.export's dynamo-based exporter needs this on recent torch; MEASURED missing in CI
]

[project.scripts]
sigscope = "sigscope.cli:main"
sigscope-gui = "sigscope.gui.app:main"
sigscope-web = "sigscope.webui.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sigscope"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S301", "S311"]
"src/sigscope/webui/server.py" = ["E501", "S608"]  # embedded HTML/JS template lines; S608 false-positives on the large f-string (no SQL anywhere in this file)

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sigscope"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sigscope --cov-report=term-missing"

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "onnxruntime.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyqtgraph.*"
ignore_missing_imports = true

[tool.bandit]
targets = ["src"]
# B608 (possible SQL injection): this project has no SQL anywhere (confirmed
# by grep -- no sqlite3/psycopg/sqlalchemy import, no SELECT/INSERT/UPDATE/
# DELETE statement). The only thing it can ever flag here is webui/server.py's
# large HTML-template f-string, a confirmed false positive on its SQL-keyword
# heuristic, found while verifying the CI pipeline runs clean end to end.
skips = ["B608"]
